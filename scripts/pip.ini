; pip configuration for lifegame.
; Selected through PIP_CONFIG_FILE (scripts/env.ps1), which overrides the
; user-level %APPDATA%\pip\pip.ini that lives on C:.
;
; `cache-dir` is relative on purpose: an absolute path would name one specific
; checkout, so a clone or a git worktree would write its cache back into the
; original checkout. pip resolves it against the working directory, which
; AGENTS.md §1 fixes at the repository root, and PIP_CACHE_DIR from
; scripts/env.ps1 takes precedence when the shell has sourced it.
;
; Authority: docs/plan/phase-01-foundation/acceptance.md — no artifact on C:.

[global]
cache-dir = .cache/pip
disable-pip-version-check = true

[install]
no-warn-script-location = true
